[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeling-harness"
version = "4.6.0"
description = "Problem-graph and autonomous-toolchain harness for mathematical modeling"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
general = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2,<4",
  "sympy>=1.12,<2",
  "matplotlib>=3.8,<4",
]
cumcm = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2,<4",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "statsmodels>=0.14,<1",
  "networkx>=3.2,<4",
  "cvxpy>=1.5,<2",
  "ortools>=9.10,<9.15",
  "openpyxl>=3.1,<4",
  "z3-solver>=4.12,<5",
]
mcm-icm = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2,<4",
  "matplotlib>=3.8,<4",
  "statsmodels>=0.14,<1",
  "networkx>=3.2,<4",
  "cvxpy>=1.5,<2",
  "sympy>=1.12,<2",
]
geo = [
  "geopandas>=0.14,<2",
  "shapely>=2,<3",
  "rasterio>=1.3,<2",
  "folium>=0.15,<1",
]
bayes = [
  "pymc>=5,<6",
  "arviz>=0.18,<2",
]
simulation = [
  "simpy>=4.1,<5",
]
ml = [
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
  "xgboost>=2,<4",
  "lightgbm>=4,<5",
]

[project.scripts]
modelharness = "modelharness.cli_v31:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modelharness*"]
exclude = ["legacy_v1*"]
