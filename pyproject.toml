[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeling-harness"
version = "3.0.0"
description = "Problem-graph-driven, evidence-gated multi-agent harness for mathematical modeling"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
modelharness = "modelharness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modelharness*"]
exclude = ["legacy_v1*"]
