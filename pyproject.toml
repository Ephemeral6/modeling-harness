[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeling-harness"
version = "1.0.0"
description = "Evidence-gated multi-agent harness for mathematical modeling"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
modelharness = "modelharness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modelharness*"]

